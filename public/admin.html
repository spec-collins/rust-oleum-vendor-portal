<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>SpecInsite · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0b0d10;
    --mute: #6b7280;
    --line: rgba(11,13,16,0.12);
    --ok: #0f7a4a;
    --danger: #b42318;
    --font-display: "Space Grotesk", sans-serif;
    --font-body: "DM Sans", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: linear-gradient(180deg, #eef1f6, #f7f8fa);
    min-height: 100vh;
    padding: 32px 16px;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: rgba(255,255,255,0.8);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
  }
  h1 {
    margin: 0 0 6px;
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  p { color: var(--mute); font-size: 14px; line-height: 1.45; }
  label { display: block; font-size: 12px; color: var(--mute); margin: 16px 0 6px; }
  input[type="password"], input[type="file"] {
    width: 100%;
    font: inherit;
  }
  input[type="password"] {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  button {
    margin-top: 18px;
    width: 100%;
    border: none;
    border-radius: 10px;
    background: var(--ink);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    padding: 13px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #status { margin-top: 14px; font-size: 13px; white-space: pre-wrap; }
  #status.ok { color: var(--ok); font-weight: 600; }
  #status.err { color: var(--danger); }
</style>
</head>
<body>
  <div class="card">
    <h1>Dashboard ingest</h1>
    <p>Upload the Cleaners vendor dashboard one-pager (.xlsx). Upserts all ranked vendor rows into the portal snapshot.</p>
    <label for="token">Admin token</label>
    <input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN">
    <label for="file">Excel file</label>
    <input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    <button type="button" id="go">Ingest workbook</button>
    <div id="status"></div>
  </div>
<script>
(function () {
  const status = document.getElementById('status');
  const btn = document.getElementById('go');
  btn.addEventListener('click', async () => {
    const token = document.getElementById('token').value.trim();
    const file = document.getElementById('file').files[0];
    status.className = '';
    status.textContent = '';
    if (!token) { status.className = 'err'; status.textContent = 'Admin token required.'; return; }
    if (!file) { status.className = 'err'; status.textContent = 'Choose an .xlsx file.'; return; }
    btn.disabled = true;
    status.textContent = 'Uploading…';
    try {
      const buf = await file.arrayBuffer();
      const res = await fetch('/api/admin-ingest?token=' + encodeURIComponent(token), {
        method: 'POST',
        headers: {
          'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
          'x-admin-token': token,
        },
        body: buf,
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Ingest failed');
      status.className = 'ok';
      status.textContent = `Upserted ${data.upserted} vendors from “${data.sheet}”.`;
    } catch (err) {
      status.className = 'err';
      status.textContent = err.message || String(err);
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
